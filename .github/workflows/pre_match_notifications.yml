name: Pre-match Telegram notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pre-match-notifications
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  APP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: Capture workflow start time
        id: run_started
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
        id: deps
      - name: Refresh and notify matches near kickoff
        id: pre_match
        run: python -m notifications.pre_match
      - name: Send coupon when current Nesine odds arrive
        id: nesine_coupon
        if: always() && steps.deps.outcome == 'success'
        continue-on-error: true
        run: python -m notifications.daily_coupon | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert failed Nesine coupon delivery
        if: steps.nesine_coupon.outcome == 'failure' && !contains(steps.nesine_coupon.outcome, 'skipped')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: Nesine kupon gönderimi
        run: python -m notifications.operational_alerts --notify --workflow "Maç önü bildirimleri" --reason "Nesine oranlı kupon gönderimi başarısız oldu"
      - name: Capture fixed-horizon forecasts
        id: horizons
        run: python -m evaluation.forecast_horizons --capture | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert logged runtime errors
        if: success()
        continue-on-error: true
        env:
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
        run: python -m notifications.operational_alerts --events-only --notify --workflow "Maç önü bildirimleri"
      - name: Alert failed pre-match workflow
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: >-
            ${{ steps.checkout.outcome == 'failure' && 'Checkout; ' || '' }}
            ${{ steps.python.outcome == 'failure' && 'Python kurulumu; ' || '' }}
            ${{ steps.deps.outcome == 'failure' && 'Bağımlılıklar; ' || '' }}
            ${{ steps.pre_match.outcome == 'failure' && 'Maç önü tahmin/bildirim; ' || '' }}
            ${{ steps.horizons.outcome == 'failure' && 'Vade tahmini kaydı; ' || '' }}
        run: python -m notifications.operational_alerts --notify --workflow "Maç önü bildirimleri" --reason "Maç önü otomasyonu başarısız oldu"
