name: Nesine daily odds collection

on:
  # Retry throughout the Turkish football day so late-published markets are collected.
  # UTC+3: 06:17, 08:17, ... 22:17 Istanbul time.
  schedule:
    - cron: "17 3-19/2 * * *"
  workflow_dispatch:

concurrency:
  group: nesine-daily-odds
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  APP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: Capture workflow start time
        id: run_started
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        id: deps
        run: python -m pip install --disable-pip-version-check requests playwright
      - name: Cache Chromium
        id: browser_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: Install Chromium
        id: browser
        run: python -m playwright install chromium
      - name: Collect today's visible Nesine odds
        id: nesine
        run: python -m data_pipeline.nesine_odds | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert failed Nesine collector
        if: failure()
        env:
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: >-
            ${{ steps.checkout.outcome == 'failure' && 'Checkout; ' || '' }}
            ${{ steps.python.outcome == 'failure' && 'Python kurulumu; ' || '' }}
            ${{ steps.deps.outcome == 'failure' && 'Kolektör bağımlılıkları; ' || '' }}
            ${{ steps.browser.outcome == 'failure' && 'Chromium kurulumu; ' || '' }}
            ${{ steps.nesine.outcome == 'failure' && 'Nesine oran çekimi; ' || '' }}
        run: python -m notifications.operational_alerts --notify --workflow "Nesine günlük oran çekimi" --reason "Nesine oran çekimi başarısız oldu"
