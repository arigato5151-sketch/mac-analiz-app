name: Confirmed lineups refresh

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "*/30 11-22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confirmed-lineup-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fetch confirmed lineups for imminent matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_lineups
