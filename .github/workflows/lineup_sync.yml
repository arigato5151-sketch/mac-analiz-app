name: Kesinleşen kadroları yenileme

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "*/30 11-22 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: confirmed-lineup-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu hazırla
        uses: actions/checkout@v5
      - name: Python 3.12 ortamını kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Python bağımlılıklarını kur
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Yaklaşan maçların kesinleşen kadrolarını al
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_lineups
      - name: Takımların önceki maç kadrolarını tamamla
        if: github.event_name == 'workflow_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_lineups --backfill-previous
      - name: Yapay zekâ analizlerini yenile
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: gemini-3.8-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
        run: python -m data_pipeline.precompute_match_analysis
      - name: Ayrıntılı Telegram raporunu gönder
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          STEP_RESULTS_JSON: ${{ toJSON(steps) }}
        run: python -m data_pipeline.notify_workflow
