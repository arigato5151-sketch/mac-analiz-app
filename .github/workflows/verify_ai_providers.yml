name: Verify AI provider keys

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check AI provider credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
        run: python -m data_pipeline.verify_ai_providers
      - name: Send detailed Telegram workflow report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          STEP_RESULTS_JSON: ${{ toJSON(steps) }}
        run: python -m data_pipeline.notify_workflow
