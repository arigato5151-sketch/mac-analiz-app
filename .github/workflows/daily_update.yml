name: Match statistics sync

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ODDS_HISTORY_ALERT_ROWS: ${{ vars.ODDS_HISTORY_ALERT_ROWS || '100000' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Refresh fixtures
        run: python -m data_pipeline.fetch_fixtures --days 14
      - name: Allow API-Football rate-limit window to reset
        run: sleep 65
      - name: Refresh completed match scores and statistics
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Pull IdDaa daily fixtures and all listed markets
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *' || github.event.schedule == '30 20 * * *'
        run: python -m data_pipeline.fetch_iddaa_odds --retries 3
      - name: Report retained odds history size
        if: always()
        run: python -m data_pipeline.monitor_odds_history
      - name: Report upcoming fixture coverage and odds freshness
        if: always()
        run: python -m data_pipeline.monitor_data_freshness
      - name: Add failure details to the run summary
        if: failure()
        run: echo "A pipeline step failed. Inspect this run's logs for fixture, result, or partial odds coverage details." >> "$GITHUB_STEP_SUMMARY"
      - name: Send optional Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m data_pipeline.notify_failure "Maç Analiz GitHub Actions pipeline başarısız. GitHub Actions çalışma günlüğünü kontrol edin."
