name: Günlük maç verileri ve analiz eşitleme

on:
  schedule:
    - cron: "18 22 * * *"
  workflow_dispatch:
    inputs:
      ai_only:
        description: Regenerate AI commentary without refreshing fixtures, odds, results, or sending a Telegram report
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  ODDS_HISTORY_ALERT_ROWS: ${{ vars.ODDS_HISTORY_ALERT_ROWS || '100000' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu hazırla
        uses: actions/checkout@v5
      - name: Python 3.12 ortamını kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Python bağımlılıklarını kur
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Kod denetimi araçlarını kur
        run: python -m pip install --disable-pip-version-check ruff pytest
      - name: Python dosyalarını derle
        run: python -m compileall -q app config data_pipeline db tests
      - name: Ruff kod denetimini çalıştır
        run: python -m ruff check .
      - name: Python testlerini çalıştır
        run: python -m pytest -q
      - name: SQL geçişlerini doğrula
        run: python -m db.migrations --validate
      - name: Canlı veritabanı geçiş kaydını doğrula
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m db.migrations --verify-production
      - name: Canlı tablo erişim izinlerini doğrula
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m db.verify_acl
      - name: IdDaa fikstürlerini yenile
        id: refresh_fixtures
        if: inputs.ai_only != true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_iddaa_fixtures
      - name: Günlük IdDaa fikstür ve oranlarını al
        id: refresh_odds
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && inputs.ai_only != true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_iddaa_odds --retries 3
      - name: Tamamlanan maçların skor ve istatistiklerini yenile
        id: refresh_results
        if: inputs.ai_only != true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Zamanlanmış çalışma için yapay zekâ anahtarını doğrula
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (inputs.ai_only == true || (steps.refresh_fixtures.outcome == 'success' && steps.refresh_odds.outcome == 'success' && steps.refresh_results.outcome == 'success'))
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$NVIDIA_API_KEY" ]; then
            echo "No AI provider key is configured; scheduled AI commentary cannot be generated."
            exit 1
          fi
      - name: Yapay zekâ maç yorumlarını üret ve kaydet
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (inputs.ai_only == true || (steps.refresh_fixtures.outcome == 'success' && steps.refresh_odds.outcome == 'success' && steps.refresh_results.outcome == 'success'))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: gemini-3.8-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
        run: python -m data_pipeline.precompute_match_analysis
      - name: Oran geçmişi boyutunu raporla
        if: always() && inputs.ai_only != true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.monitor_odds_history
      - name: Yaklaşan maç kapsamı ve oran güncelliğini raporla
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        if: always() && inputs.ai_only != true
        run: python -m data_pipeline.monitor_data_freshness
      - name: Ayrıntılı Telegram raporunu gönder
        if: always() && inputs.ai_only != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          STEP_RESULTS_JSON: ${{ toJSON(steps) }}
        run: python -m data_pipeline.notify_workflow
