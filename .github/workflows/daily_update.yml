name: Daily data update

on:
  schedule:
    # Turkey is UTC+3 year-round: 06:00, 23:30, and a late 02:30 result sweep.
    - cron: "0 3 * * *"
    - cron: "30 20 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Update task to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - morning
          - night

concurrency:
  group: daily-data-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  APP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  morning:
    if: >-
      github.event.schedule == '0 3 * * *' ||
      github.event.inputs.task == 'morning' ||
      github.event.inputs.task == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: Capture workflow start time
        id: run_started
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
        id: deps
      - name: Install browser runtime for optional Nesine collector
        id: browser
        run: python -m playwright install chromium
      - name: Verify production migration ledger
        id: migrations
        run: python -m db.migrations --verify-production | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sync next seven days
        id: fixtures
        run: python -m data_pipeline.fetch_fixtures --days 7
      - name: Sync upcoming bookmaker odds
        id: odds
        run: python -m data_pipeline.sync_odds --days 7 --max-matches 120 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect visible Nesine odds
        id: nesine
        continue-on-error: true
        run: |
          python -m data_pipeline.nesine_odds | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Nesine collector tamamlandı; eşleşmeyen maçlar kupona alınmadı." >> "$GITHUB_STEP_SUMMARY"
      - name: Alert failed Nesine collector
        if: steps.nesine.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: Nesine oran çekimi
        run: python -m notifications.operational_alerts --notify --reason "Opsiyonel Nesine oran çekimi başarısız oldu"
      - name: Refresh team form, Elo, and availability
        id: context
        run: python -m data_pipeline.refresh_context --days 7
      - name: Collect daily shadow-candidate predictions
        id: shadow
        continue-on-error: true
        run: python -m models.shadow --days 7
      - name: Alert failed shadow prediction
        if: steps.shadow.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: Gölge tahmin üretimi
        run: python -m notifications.operational_alerts --notify --reason "Gölge tahmin adımı başarısız oldu"
      - name: Generate upcoming predictions
        id: predictions
        run: python -m models.predict --days 7
      - name: Send daily coupon to Telegram
        id: coupon
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.daily_coupon | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate data quality
        id: quality
        run: python -m data_pipeline.data_quality --days 7 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert logged runtime errors
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
        run: python -m notifications.operational_alerts --events-only --notify --workflow "Günlük veri güncellemesi"
      - name: Sync today's final scores
        id: final_scores
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'full'
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Evaluate completed predictions
        id: evaluation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'full'
        run: python -m evaluation.track_performance
      - name: Send Telegram final result notifications
        id: final_notifications
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'full'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.final_results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Send Telegram performance summary
        id: performance_summary
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'full'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.daily_summary --mode night
      - name: Validate operational health
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'full'
        id: health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
        run: python -m notifications.operational_alerts --notify --fail-on-critical | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert failed morning pipeline
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: >-
            ${{ steps.checkout.outcome == 'failure' && 'Checkout; ' || '' }}
            ${{ steps.python.outcome == 'failure' && 'Python kurulumu; ' || '' }}
            ${{ steps.deps.outcome == 'failure' && 'Bağımlılıklar; ' || '' }}
            ${{ steps.browser.outcome == 'failure' && 'Tarayıcı kurulumu; ' || '' }}
            ${{ steps.migrations.outcome == 'failure' && 'Migration doğrulama; ' || '' }}
            ${{ steps.fixtures.outcome == 'failure' && 'Fikstür senkronu; ' || '' }}
            ${{ steps.odds.outcome == 'failure' && 'Oran senkronu; ' || '' }}
            ${{ steps.context.outcome == 'failure' && 'Takım bağlamı; ' || '' }}
            ${{ steps.predictions.outcome == 'failure' && 'Tahmin üretimi; ' || '' }}
            ${{ steps.coupon.outcome == 'failure' && 'Günlük kupon; ' || '' }}
            ${{ steps.quality.outcome == 'failure' && 'Veri kalite kontrolü; ' || '' }}
            ${{ steps.final_scores.outcome == 'failure' && 'Skor senkronu; ' || '' }}
            ${{ steps.evaluation.outcome == 'failure' && 'Tahmin değerlendirmesi; ' || '' }}
            ${{ steps.final_notifications.outcome == 'failure' && 'Sonuç bildirimleri; ' || '' }}
            ${{ steps.performance_summary.outcome == 'failure' && 'Performans özeti; ' || '' }}
            ${{ steps.health.outcome == 'failure' && 'Operasyon sağlık kontrolü; ' || '' }}
        run: python -m notifications.operational_alerts --notify --workflow "Günlük veri güncellemesi" --reason "Sabah veri hattı başarısız oldu"

  night:
    if: >-
      github.event.schedule == '30 20 * * *' ||
      github.event.schedule == '30 23 * * *' ||
      github.event.inputs.task == 'night'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: Capture workflow start time
        id: run_started
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
        id: deps
      - name: Verify production migration ledger
        id: migrations
        run: python -m db.migrations --verify-production | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sync today's final scores
        id: final_scores
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Evaluate completed predictions
        id: evaluation
        run: python -m evaluation.track_performance
      - name: Send Telegram final result notifications
        id: final_notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.final_results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Send Telegram performance summary
        id: night_summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.daily_summary --mode night
      - name: Validate operational health
        id: health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
        run: python -m notifications.operational_alerts --notify --fail-on-critical | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert failed night pipeline
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_RUN_STARTED_AT: ${{ steps.run_started.outputs.started_at }}
          FAILED_STEPS: >-
            ${{ steps.checkout.outcome == 'failure' && 'Checkout; ' || '' }}
            ${{ steps.python.outcome == 'failure' && 'Python kurulumu; ' || '' }}
            ${{ steps.deps.outcome == 'failure' && 'Bağımlılıklar; ' || '' }}
            ${{ steps.migrations.outcome == 'failure' && 'Migration doğrulama; ' || '' }}
            ${{ steps.final_scores.outcome == 'failure' && 'Skor senkronu; ' || '' }}
            ${{ steps.evaluation.outcome == 'failure' && 'Tahmin değerlendirmesi; ' || '' }}
            ${{ steps.final_notifications.outcome == 'failure' && 'Sonuç bildirimleri; ' || '' }}
            ${{ steps.night_summary.outcome == 'failure' && 'Gece performans özeti; ' || '' }}
            ${{ steps.health.outcome == 'failure' && 'Operasyon sağlık kontrolü; ' || '' }}
        run: python -m notifications.operational_alerts --notify --workflow "Gece sonuç senkronu" --reason "Gece veri hattı başarısız oldu"
