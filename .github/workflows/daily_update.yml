name: Match statistics sync

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Refresh fixtures
        run: python -m data_pipeline.fetch_fixtures --days 14
      - name: Refresh completed match scores and statistics
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Pull IdDaa daily fixtures and all listed markets
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        run: python -m data_pipeline.fetch_iddaa_odds --retries 3
