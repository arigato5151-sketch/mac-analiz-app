name: Match statistics sync

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ODDS_HISTORY_ALERT_ROWS: ${{ vars.ODDS_HISTORY_ALERT_ROWS || '100000' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip install --disable-pip-version-check ruff pytest
      - name: Compile Python modules
        run: python -m compileall -q app config data_pipeline db tests
      - name: Ruff lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Validate SQL migrations
        run: python -m db.migrations --validate
      - name: Verify production migration ledger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m db.migrations --verify-production
      - name: Verify production public table ACLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m db.verify_acl
      - name: Refresh fixtures from IdDaa bulletin
        id: refresh_fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_iddaa_fixtures
      - name: Pull IdDaa daily fixtures and all listed markets
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *' || github.event.schedule == '30 20 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_iddaa_odds --retries 3
      - name: Refresh completed match scores and statistics
        id: refresh_results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Precompute nightly match analysis
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 20 * * *') && steps.refresh_fixtures.outcome == 'success' && steps.refresh_results.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: gemini-3.8-flash
        run: python -m data_pipeline.precompute_match_analysis
      - name: Report retained odds history size
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m data_pipeline.monitor_odds_history
      - name: Report upcoming fixture coverage and odds freshness
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        if: always()
        run: python -m data_pipeline.monitor_data_freshness
      - name: Add failure details to the run summary
        if: failure()
        run: echo "A pipeline step failed. Inspect this run's logs for fixture, result, or partial odds coverage details." >> "$GITHUB_STEP_SUMMARY"
      - name: Send optional Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m data_pipeline.notify_failure "Maç Analiz GitHub Actions pipeline başarısız. GitHub Actions çalışma günlüğünü kontrol edin."
