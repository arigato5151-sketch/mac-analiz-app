name: Daily data update

on:
  schedule:
    # Turkey is UTC+3 year-round: 06:00, 23:30, and a late 02:30 result sweep.
    - cron: "0 3 * * *"
    - cron: "30 20 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Update task to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - morning
          - night

concurrency:
  group: daily-data-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  morning:
    if: >-
      github.event.schedule == '0 3 * * *' ||
      github.event.inputs.task == 'morning' ||
      github.event.inputs.task == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Sync next three days
        run: python -m data_pipeline.fetch_fixtures --days 3
      - name: Refresh team form, Elo, and availability
        run: python -m data_pipeline.refresh_context --days 3
      - name: Generate upcoming predictions
        run: python -m models.predict --model models/saved_models/latest.joblib --days 3
      - name: Validate data quality
        run: python -m data_pipeline.data_quality --days 3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert failed morning pipeline
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.operational_alerts --notify --reason "Sabah veri hattı başarısız oldu"

  night:
    if: >-
      github.event.schedule == '30 20 * * *' ||
      github.event.schedule == '30 23 * * *' ||
      github.event.inputs.task == 'night' ||
      github.event.inputs.task == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Sync today's final scores
        run: python -m data_pipeline.fetch_results --lookback-days 7
      - name: Evaluate completed predictions
        run: python -m evaluation.track_performance
      - name: Send evaluated-match Telegram messages
        id: final_results
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.final_results
      - name: Send Telegram performance summary
        id: night_summary
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.daily_summary --mode night
      - name: Validate operational health
        id: health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.operational_alerts --notify --fail-on-critical | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert failed night notification step
        if: steps.final_results.outcome == 'failure' || steps.night_summary.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notifications.operational_alerts --notify --reason "Gece Telegram bildirim adımı başarısız oldu"
