name: Result Telegram notifications

on:
  schedule:
    # Reconcile final scores and deliver result cards shortly after full time.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: result-telegram-notifications
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify production migration ledger
        run: python -m db.migrations --verify-production
      - name: Reconcile today's final scores
        run: python -m data_pipeline.fetch_results --lookback-days 0
      - name: Evaluate newly completed predictions
        run: python -m evaluation.track_performance
      - name: Send one result card per completed match
        run: python -m notifications.final_results
