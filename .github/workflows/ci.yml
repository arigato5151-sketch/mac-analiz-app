name: Sürekli bütünleştirme denetimi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu hazırla
        uses: actions/checkout@v5
      - name: Python 3.12 ortamını kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılık ve denetim araçlarını kur
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check ruff pytest
      - name: Python dosyalarını derle
        run: python -m compileall -q app config data_pipeline db tests
      - name: Ruff kod denetimini çalıştır
        run: python -m ruff check .
      - name: Python testlerini çalıştır
        run: python -m pytest -q
      - name: SQL geçişlerini doğrula
        run: python -m db.migrations --validate
      - name: Ayrıntılı Telegram raporunu gönder
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          STEP_RESULTS_JSON: ${{ toJSON(steps) }}
        run: python -m data_pipeline.notify_workflow
