name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m db.migrations --validate
      - run: python -m compileall -q app config data_pipeline db evaluation models notifications
      - run: python -m pytest -q
