name: Weekly model retraining

on:
  schedule:
    # Monday 05:00 Turkey time.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      promote_candidate:
        description: Publish this validated candidate as the live model
        required: true
        default: false
        type: boolean
      candidate_version:
        description: Shadow candidate version to promote after it passes the live gate
        required: false
        type: string

concurrency:
  group: weekly-model-retraining
  cancel-in-progress: false

# Least privilege: this workflow only needs read access to the repository. Model
# artifacts are published to Supabase Storage, never committed to git, so a
# compromised training output cannot inject a binary into the repo.
permissions:
  contents: read

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Train and validate models
        run: python -m models.train_model
      - name: Register newest model as a shadow candidate
        run: python -m models.shadow --register-newest
      - name: Seed upcoming shadow predictions
        run: python -m models.shadow --days 3
      - name: Publish shadow candidate artifacts to Supabase Storage
        run: python -m models.artifact_store --push models/saved_models
      - name: Promote proven shadow candidate
        if: github.event_name == 'workflow_dispatch' && inputs.promote_candidate == true
        run: |
          test -n "${{ inputs.candidate_version }}"
          python -m models.shadow --promote "${{ inputs.candidate_version }}"
      - name: Refresh upcoming predictions
        if: github.event_name == 'workflow_dispatch' && inputs.promote_candidate == true
        run: python -m models.predict --model models/saved_models/latest.joblib --days 3
      - name: Publish promoted model artifact to Supabase Storage
        if: github.event_name == 'workflow_dispatch' && inputs.promote_candidate == true
        run: python -m models.artifact_store --push models/saved_models
